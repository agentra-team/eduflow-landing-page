name: CI
on:
  push:
    branches: [main]
  pull_request:

# Job chỉ đọc mã nguồn (checkout, cài, kiểm, dựng): token không cần quyền ghi nào.
permissions:
  contents: read

# Một lần đẩy mới lên cùng nhánh hoặc cùng pull request huỷ lần chạy cũ đang dở (20 phút mỗi lần).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://eduflow.example.test
  # ID giả để e2e kiểm tra được cổng đồng ý cookie; production lấy ID thật từ Vercel.
  NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      # Mọi chế độ dựng từ snapshot rỗng: sắp phát hành cần nó, còn một hệ điều hành sẽ lấy macOS từ snapshot nếu repo đã commit bản thật.
      - run: |
          echo '{ "baseUrl": null, "windows": null, "mac": null }' > content/releases.json
      # Chế độ feed: dựng với feed giả chạy nền trên cổng 3300
      - run: node scripts/serve-fixtures.mjs &
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:3300/latest.yml > /dev/null
      - run: pnpm build
        env: { DOWNLOAD_FEED_URL: 'http://localhost:3300/' }
      - run: pnpm e2e
        env: { CI: true, E2E_MODE: feed, DOWNLOAD_FEED_URL: 'http://localhost:3300/' }
      # Chế độ một hệ điều hành: feed giả thứ hai trên cổng 3301 trả 404 cho latest-mac.yml (Ruling 38)
      - run: FIXTURE_PORT=3301 FIXTURE_MISSING=latest-mac.yml node scripts/serve-fixtures.mjs &
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:3301/latest.yml > /dev/null
      - run: pnpm build
        env: { DOWNLOAD_FEED_URL: 'http://localhost:3301/' }
      - run: pnpm e2e
        env: { CI: true, E2E_MODE: oneos, DOWNLOAD_FEED_URL: 'http://localhost:3301/' }
      # Chế độ sắp phát hành: không có feed, snapshot rỗng
      - run: pnpm build
        env: { DOWNLOAD_FEED_URL: '' }
      - run: pnpm e2e
        env: { CI: true, E2E_MODE: prelaunch }
      # Lighthouse chấm canonical theo domain đang chạy → build lại với URL localhost trước khi đo
      - run: pnpm build
        env: { NEXT_PUBLIC_SITE_URL: 'http://localhost:3200', DOWNLOAD_FEED_URL: 'http://localhost:3300/' }
      - run: pnpm lhci
      # Báo cáo Lighthouse (kể cả khi chỉ cảnh báo Performance) và vết Playwright khi test hỏng. v4 bỏ qua thư mục ẩn nếu không bật include-hidden-files.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: |
            .lighthouseci
            test-results
          include-hidden-files: true
          if-no-files-found: ignore
